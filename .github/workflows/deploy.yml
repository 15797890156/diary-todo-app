name: Build and Deploy Webon:  push:    branches: [ main, master ]  workflow_dispatch:permissions:  contents: read  pages: write  id-token: writeconcurrency:  group: "pages"  cancel-in-progress: falsejobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout repository        uses: actions/checkout@v4      - name: Setup Flutter        uses: subosito/flutter-action@v2        with:          flutter-version: '3.24.5'          channel: 'stable'          cache: true      - name: Get dependencies        run: flutter pub get      - name: Build web        run: flutter build web --release --web-renderer html      - name: Setup Pages        uses: actions/configure-pages@v4      - name: Upload artifact        uses: actions/upload-pages-artifact@v3        with:          path: 'build/web'  deploy:    environment:      name: github-pages      url: ${{ steps.deployment.outputs.page_url }}    runs-on: ubuntu-latest    needs: build    steps:      - name: Deploy to GitHub Pages        id: deployment        uses: actions/deploy-pages@v4
