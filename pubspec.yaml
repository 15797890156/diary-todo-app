name: diary_todo_app
description: 一款功能丰富的日记待办应用，支持日历、待办清单、日记和个性化主题。

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase 相关 (已注释，改用本地存储)
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.16.0
  # cloud_firestore: ^4.14.0
  # firebase_storage: ^11.6.0

  # 状态管理
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # 日历组件
  table_calendar: ^3.0.9

  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # 图片选择
  image_picker: ^1.0.7

  # 图标
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6

  # 工具类
  intl: ^0.19.0
  uuid: ^4.3.1

  # 动画
  flutter_animate: ^4.3.0

  # 路由
  go_router: ^13.0.0

  # 健康数据（手环/手表同步）
  health: ^10.0.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
